<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{width:286px;margin:0;padding:17px;font:14px system-ui,-apple-system,sans-serif;color:#1f2937;background:#fff}.header{display:flex;align-items:center;gap:10px;margin-bottom:16px}.header img{width:42px;height:42px;border-radius:8px}.header h1{font-size:15px;margin:0;line-height:1.3}.sub{font-size:11px;color:#64748b;margin-top:3px}.section-divider{border-top:1px solid #e2e8f0;margin:14px 0}fieldset{border:0;margin:0;padding:0}legend{font-weight:650;margin-bottom:9px}label{display:flex;align-items:center;gap:10px;padding:7px 11px;border:1px solid #d6dde6;border-radius:10px;margin:7px 0;cursor:pointer}fieldset label{margin:5px 0}label:has(input:checked){border-color:#243c51;background:#f1f5f9}input{accent-color:#243c51;width:16px;height:16px;margin:0}
</style></head><body><div class="header"><img src="icon48.png" alt="Raven carrying cookie"><div><h1>Raven Pop-up Remover</h1><div class="sub">Cookie consent preferences</div></div></div><fieldset><legend>Automatically handle cookie pop-ups</legend><label><input type="radio" name="mode" value="accept"><span>Accept all</span></label><label><input type="radio" name="mode" value="reject"><span>Reject all</span></label><label><input type="radio" name="mode" value="off"><span>Off — don't click anything</span></label></fieldset><div class="section-divider"></div><div style="font-weight:650;margin-bottom:8px">Website whitelist</div><div id="site" style="font-size:12px;color:#64748b;overflow-wrap:anywhere;margin-bottom:8px">Checking current website…</div><label style="margin-top:0;margin-bottom:0"><input type="checkbox" id="allowlist"><span>Never act on this website</span></label><script src="popup.js"></script></body></html>
